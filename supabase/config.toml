# Local Supabase CLI config. Run `supabase start` for a local stack, or
# `supabase link --project-ref <ref>` then `supabase db push` against your
# hosted project. See README.md for the full workflow.
project_id = "tp-growth-pool"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
# Configure a real provider (Twilio / MessageBird / Vonage / MSG91) in the
# hosted Supabase Dashboard under Authentication → Providers → Phone.
# Local dev without a provider: Supabase CLI logs OTP codes to the
# terminal instead of sending an SMS.
